<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Positive Flow</title>
<style>
body{font-family:Arial;max-width:700px;margin:30px auto;padding:20px;background:#f0fff4;color:#173b2d}
h1{color:#159957}
textarea,input,button{width:100%;box-sizing:border-box;padding:10px;margin:6px 0;border:1px solid #b7e4c7;border-radius:8px}
button{background:#159957;color:white;cursor:pointer}
article{background:white;padding:14px;margin:14px 0;border-radius:10px;box-shadow:0 2px 8px #cde8d5}
.comments p{margin:6px 0;color:#24734d}
.comment-row{display:flex;gap:6px;align-items:center}
.comment-row input{flex:1;min-width:0}
.comment-row button{width:auto;white-space:nowrap}
small{color:#52806a}
</style>
</head>
<body>
<h1>🌱 Positive Flow</h1>
<p>Share what is going well or what you hope to accomplish.</p>
<textarea id="post" placeholder="Write a positive update or future goal..."></textarea>
<button onclick="addPost()">Share Post</button>
<main id="feed"></main>
<script>
const feed=document.querySelector("#feed");
const SUPABASE_URL="https://qvaxqblpkrolazxbwykn.supabase.co";
const SUPABASE_KEY=undefined;
const headers={apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"};
async function db(path,options){options=options||{};const response=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...options,headers:{...headers,...(options.headers||{}),Prefer:"return=representation"}});if(!response.ok)throw new Error(await response.text());return response.status===204?[]:response.json();}
async function loadFeed(){feed.innerHTML="";const results=await Promise.all([db("posts?select=*&order=created_at.desc"),db("comments?select=*&order=created_at.asc")]);const posts=results[0],comments=results[1],byPost={};comments.forEach(item=>{if(!byPost[item.post_id])byPost[item.post_id]=[];byPost[item.post_id].push(item);});posts.forEach(post=>renderPost(post,byPost[post.id]||[]));}
function renderPost(post,comments){const card=document.createElement("article");card.innerHTML="<b></b><small></small><p></p><div class="comment-row"><input placeholder="Add an encouraging comment..."><button type="button">Encourage</button></div><div class="comments"></div>";card.querySelector("b").textContent=post.author_name;card.querySelector("small").textContent=" • "+new Date(post.created_at).toLocaleDateString();card.querySelector("p").textContent=post.content;const input=card.querySelector("input"),commentButton=card.querySelector("button"),commentsBox=card.querySelector(".comments");commentButton.addEventListener("click",()=>comment(input,post.id));input.addEventListener("keydown",event=>{if(event.key==="Enter")comment(input,post.id);});comments.forEach(item=>{const p=document.createElement("p");p.textContent="💚 "+item.content;commentsBox.append(p);});feed.append(card);}
async function addPost(text){text=text||document.querySelector("#post").value.trim();if(!text)return;try{await db("posts",{method:"POST",body:JSON.stringify({content:text})});document.querySelector("#post").value="";await loadFeed();}catch(error){alert("Your post could not be saved. Please try again.");console.error(error);}}
async function comment(input,postId){const text=input.value.trim();if(!text)return;try{await db("comments",{method:"POST",body:JSON.stringify({post_id:postId,content:text})});input.value="";await loadFeed();}catch(error){alert("Your comment could not be saved. Please try again.");console.error(error);}}
loadFeed().catch(error=>{feed.innerHTML="<article><p>Could not load Positive Flow right now. Please refresh and try again.</p></article>";console.error(error);});
</script>
</body>
</html>
